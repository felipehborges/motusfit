pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      glob: '*.{ts,tsx,js,jsx,json}'
    - name: typecheck
      run: pnpm turbo run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
